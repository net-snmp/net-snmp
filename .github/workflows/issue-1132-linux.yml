name: Issue 1132 Linux build check

on:
  push:
    branches:
      - codex/issue-1132
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libperl-dev \
            libpcre2-dev \
            build-essential

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j2

      - name: Test
        run: make check
